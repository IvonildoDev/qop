<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QOP - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    </head>

<body class="login-page">
    <div class="login-shell">
        <aside class="login-brand">
            <div class="logo">QOP</div>
            <div>
                <h1>Checklists operacionais, sem papel.</h1>
                <p>Registre inspeções, anexe fotos e acompanhe as não conformidades da operação em um só lugar.</p>
            </div>
            <small>&copy; 2025 QOP · Desenvolvido por Ivonildo Lima</small>
        </aside>

    <div class="login-container">
        <div class="login-box">
            <h2>Entrar</h2>
            <p class="login-sub">Acesse com seu usuário e senha.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Entrar</button>
            </form>
            <p id="login-message" class="message"></p>
        </div>
    </div>

    </div>

    <script src="/static/js/login.js"></script>
</body>

</html>
